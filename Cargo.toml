[package]
name = "luxos"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
half = "2.7"
hostname = "0.4"
memmap2 = "0.9"
rmcp = { version = "3.8", features = ["schemars", "transport-streamable-http-server"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }

schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "process", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }


[profile.release]
lto = "thin"
strip = "debuginfo"
