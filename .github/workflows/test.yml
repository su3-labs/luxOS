name: Runtime checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo fmt --check
      - run: for script in scripts/*.sh; do bash -n "$script"; done
